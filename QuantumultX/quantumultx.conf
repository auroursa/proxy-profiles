# Quantumult X profile — reviewed against v1.5.5 build 914 (2026-10-02)
# See README.md before importing; subscriptions and CA credentials stay on device.
[general]
# Compatibility exceptions for LAN, captive portals, games/STUN, login, NTP and AD.
# These disable Fake IP; they do not select direct/proxy. See README before pruning.
dns_exclusion_list = *.lan, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, detectportal.firefox.com, resolver1.opendns.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, *.qq.com, localhost.*.qq.com, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, *?miwifi.com, pool.ntp.org, *.pool.ntp.org, ntp.*.com, time.*.com, ntp?.*.com, time?.*.com, time.*.gov, time.*.edu.cn, *.ntp.org.cn, time.*.apple.com, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*
# These networks bypass the tunnel entirely; filter policies cannot override them.
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 239.255.255.250/32
profile_img_url = https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/icon/profile.png
server_check_url = http://cp.cloudflare.com/generate_204
server_check_timeout = 3000
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/38a6fe02eb7cc67efd26a8f3c618bd031f1885b4/Scripts/resource-parser.js

[dns]
# Concurrent encrypted resolvers; DoH3 falls back to HTTP/2.
prefer-doh3
doh-server = https://doh.pub/dns-query, https://223.5.5.5/dns-query, https://223.6.6.6/dns-query
# Keep IPv6 enabled. Only uncomment for a verified IPv6 connectivity problem.
;no-ipv6

[policy]
# Select a fixed node in Manual after adding your subscription.
# proxy remains the default until a node is selected; Auto is opt-in.
static = Manual, proxy, server-tag-regex=^.+$
url-latency-benchmark = Auto, server-tag-regex=^.+$, check-interval=900, alive-checking=false, tolerance=50
static = Apple, direct, Manual, Auto, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = APNs, direct, Manual, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = AppleIntelligence, Manual, proxy, direct, server-tag-regex=^.+$
static = Siri, Manual, proxy, direct, server-tag-regex=^.+$
static = OpenAI, Manual, proxy, direct, server-tag-regex=^.+$
static = Anthropic, Manual, proxy, direct, server-tag-regex=^.+$
static = GitHub, Manual, Auto, proxy, direct, server-tag-regex=^.+$
static = Google, Manual, Auto, proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
static = Microsoft, Manual, Auto, proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
static = Telegram, Manual, Auto, proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static = Twitter, Manual, Auto, proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png
static = ForeignMedia, Manual, proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ForeignMedia.png, server-tag-regex=^.+$
static = DomesticMedia, direct, Manual, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/DomesticMedia.png
static = Global, Manual, Auto, proxy, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
static = China, direct, Manual, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png
static = Final, Global, Manual, Auto, proxy, direct

[server_remote]
# Add your private subscription in the app. Never commit the real URL/token.
# Native QX subscription: opt-parser=false; Clash/URI subscriptions: opt-parser=true.
;https://example.com/subscription, tag=Private, update-interval=86400, opt-parser=true, enabled=false

[filter_remote]
# Insert resources before filter_local so GeoIP CN cannot shadow service rules.
# First match wins: LAN -> dedicated services -> broad services -> Global -> China.
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/apns.txt, tag=APNs, force-policy=APNs, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/apple-intelligence.txt, tag=AppleIntelligence, force-policy=AppleIntelligence, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/siri.txt, tag=Siri, force-policy=Siri, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/openai.txt, tag=OpenAI, force-policy=OpenAI, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/anthropic.txt, tag=Anthropic, force-policy=Anthropic, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/github.txt, tag=GitHub, force-policy=GitHub, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/filter/technews.txt, tag=TechNews, force-policy=Global, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram, force-policy=Telegram, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Twitter/Twitter.list, tag=Twitter, force-policy=Twitter, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GlobalMedia/GlobalMedia.list, tag=ForeignMedia, force-policy=ForeignMedia, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMedia/ChinaMedia.list, tag=DomesticMedia, force-policy=DomesticMedia, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Google/Google.list, tag=Google, force-policy=Google, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Microsoft/Microsoft.list, tag=Microsoft, force-policy=Microsoft, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=Apple, force-policy=Apple, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Proxy/Proxy.list, tag=Global, force-policy=Global, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list, tag=China, force-policy=China, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true

[rewrite_remote]
# Optional: enable only after generating/trusting a device-local CA for HTTPS.
https://raw.githubusercontent.com/froseiun/proxy-profiles/master/QuantumultX/rewrite-rules.conf, tag=GoogleRedirect, update-interval=86400, opt-parser=false, enabled=false
# Legacy workaround; enable only for the matching TestFlight installation issue.
https://raw.githubusercontent.com/NobyDa/Script/8d2249d1e114d09fca4c37a824ba06f5c92c410b/QuantumultX/TestFlightDownload.conf, tag=TestFlight, update-interval=-1, opt-parser=false, enabled=false

[server_local]
# Device-local nodes may be added here; do not commit credentials.

[filter_local]
# Resources above are inserted before these fallbacks. Personal overrides belong
# in a separate inserted resource placed immediately after LAN (see README).
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
ip6-cidr, ::1/128, direct
ip6-cidr, fc00::/7, direct
ip6-cidr, fe80::/10, direct
geoip, cn, China
final, Final

[rewrite_local]

[task_local]

[mitm]
# Generate the CA on device. Never publish passphrase/p12 or disable verification.
passphrase =
p12 =
skip_validating_cert = false
